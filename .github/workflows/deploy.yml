name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Public, read-only demo login shown on the Official sign-in page (042).
      VITE_DEMO_EMAIL: ${{ secrets.VITE_DEMO_EMAIL }}
      VITE_DEMO_PASSWORD: ${{ secrets.VITE_DEMO_PASSWORD }}
      # Shared password of the three practice logins (072, D3), shown on the sign-in page.
      VITE_PRACTICE_PASSWORD: ${{ secrets.VITE_PRACTICE_PASSWORD }}
      # Team logins (084, 9 Oct): filled in by the Head / Manager / Officer buttons.
      # Sameer's choice; the Admin can undo their non-case changes (085).
      VITE_TEAM_HEAD_PASSWORD: ${{ secrets.VITE_TEAM_HEAD_PASSWORD }}
      VITE_TEAM_MANAGER_PASSWORD: ${{ secrets.VITE_TEAM_MANAGER_PASSWORD }}
      VITE_TEAM_OFFICER_PASSWORD: ${{ secrets.VITE_TEAM_OFFICER_PASSWORD }}
      # AWS document service (upload links, readers). A public API address, not a secret.
      VITE_AWS_API_URL: https://awycwf3qlk.execute-api.ap-south-1.amazonaws.com/prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:spa

      - name: Prepare for GitHub Pages
        run: node scripts/prepare-gh-pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
